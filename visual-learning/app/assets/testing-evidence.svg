<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Testing boundaries and evidence</title><desc id="desc">Coverage, assertions and mutation support different claims. No green state proves every behavior correct.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#166c85"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#173247" text-anchor="start">Testing boundaries and evidence</text><rect x="35" y="90" width="180" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="118" font-size="18" fill="#173247" text-anchor="start">Unit</text><text x="49" y="143" font-size="14" fill="#173247" text-anchor="start">isolated behavior</text><line x1="215" y1="140" x2="245" y2="140" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="250" y="90" width="180" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="264" y="118" font-size="18" fill="#173247" text-anchor="start">Integration</text><text x="264" y="143" font-size="14" fill="#173247" text-anchor="start">component contracts</text><line x1="430" y1="140" x2="460" y2="140" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="465" y="90" width="180" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="479" y="118" font-size="18" fill="#173247" text-anchor="start">System</text><text x="479" y="143" font-size="14" fill="#173247" text-anchor="start">whole system</text><line x1="645" y1="140" x2="675" y2="140" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="680" y="90" width="180" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="694" y="118" font-size="18" fill="#173247" text-anchor="start">E2E</text><text x="694" y="143" font-size="14" fill="#173247" text-anchor="start">user path</text><rect x="35" y="260" width="250" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="288" font-size="18" fill="#173247" text-anchor="start">Coverage</text><text x="49" y="313" font-size="14" fill="#173247" text-anchor="start">Was the code executed?</text><rect x="325" y="260" width="250" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="339" y="288" font-size="18" fill="#173247" text-anchor="start">Oracle / assertions</text><text x="339" y="313" font-size="14" fill="#173247" text-anchor="start">Was the behavior checked?</text><rect x="615" y="260" width="250" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="629" y="288" font-size="18" fill="#173247" text-anchor="start">Mutation</text><text x="629" y="313" font-size="14" fill="#173247" text-anchor="start">Could tests distinguish changes?</text><text x="35" y="420" font-size="16" fill="#173247" text-anchor="start">Regression is a purpose across levels. A survived mutant requires triage, not automatic grading.</text></g></svg>
