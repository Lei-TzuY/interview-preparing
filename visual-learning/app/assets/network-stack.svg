<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Names, transport, security and routing</title><desc id="desc">DNS resolves names, TLS secures connections, TCP or UDP transports data, IP routes across networks. OSI and TCP/IP boundaries are not exact synonyms.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#166c85"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#173247" text-anchor="start">Names, transport, security and routing</text><rect x="40" y="90" width="210" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="54" y="118" font-size="18" fill="#173247" text-anchor="start">DNS</text><text x="54" y="143" font-size="14" fill="#173247" text-anchor="start">hostname → IP address</text><line x1="250" y1="130" x2="310" y2="130" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="315" y="90" width="545" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="329" y="118" font-size="18" fill="#173247" text-anchor="start">Connection to selected endpoint</text><text x="329" y="143" font-size="14" fill="#173247" text-anchor="start">Name resolution is separate from packet forwarding</text><rect x="40" y="205" width="820" height="60" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="54" y="233" font-size="18" fill="#173247" text-anchor="start">Application: HTTP</text><text x="54" y="258" font-size="14" fill="#173247" text-anchor="start">request / response semantics</text><rect x="40" y="275" width="820" height="60" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="54" y="303" font-size="18" fill="#173247" text-anchor="start">Security: TLS</text><text x="54" y="328" font-size="14" fill="#173247" text-anchor="start">authentication, confidentiality, integrity</text><rect x="40" y="345" width="360" height="60" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="54" y="373" font-size="18" fill="#173247" text-anchor="start">Transport: TCP or UDP</text><text x="54" y="398" font-size="14" fill="#173247" text-anchor="start">byte stream versus datagrams</text><rect x="470" y="345" width="390" height="60" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="484" y="373" font-size="18" fill="#173247" text-anchor="start">IP → router → next hop</text><text x="484" y="398" font-size="14" fill="#173247" text-anchor="start">network addressing / forwarding</text><text x="40" y="440" font-size="14" fill="#173247" text-anchor="start">Link = local hop. Diagram uses HTTP over TLS/TCP; HTTP/3 uses QUIC over UDP.</text></g></svg>
