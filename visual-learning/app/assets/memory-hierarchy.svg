<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Memory hierarchy and I/O responsibilities</title><desc id="desc">CPU executes and configures devices; DMA transfers data without CPU byte-by-byte copying. Cache miss, page fault and storage access are distinct.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#166c85"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#173247" text-anchor="start">Memory hierarchy and I/O responsibilities</text><rect x="35" y="80" width="220" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="108" font-size="18" fill="#173247" text-anchor="start">CPU registers / ALU</text><text x="49" y="133" font-size="14" fill="#173247" text-anchor="start">execution state / operations</text><rect x="35" y="190" width="220" height="75" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="218" font-size="18" fill="#173247" text-anchor="start">Cache</text><text x="49" y="243" font-size="14" fill="#173247" text-anchor="start">content in lines</text><rect x="35" y="295" width="220" height="75" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="323" font-size="18" fill="#173247" text-anchor="start">DRAM</text><text x="49" y="348" font-size="14" fill="#173247" text-anchor="start">resident working memory</text><rect x="35" y="395" width="220" height="55" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="423" font-size="18" fill="#173247" text-anchor="start">Storage</text><text x="49" y="448" font-size="14" fill="#173247" text-anchor="start">persistent data</text><line x1="145" y1="160" x2="145" y2="188" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="145" y1="265" x2="145" y2="293" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="145" y1="370" x2="145" y2="393" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="100" width="335" height="90" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="534" y="128" font-size="18" fill="#173247" text-anchor="start">Device controller</text><text x="534" y="153" font-size="14" fill="#173247" text-anchor="start">CPU setup, MMIO, polling</text><rect x="520" y="295" width="335" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="534" y="323" font-size="18" fill="#173247" text-anchor="start">Device / DMA engine</text><text x="534" y="348" font-size="14" fill="#173247" text-anchor="start">data transfer to / from DRAM</text><line x1="255" y1="115" x2="518" y2="135" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="520" y1="330" x2="258" y2="330" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="540" y1="100" x2="257" y2="85" stroke="#166c85" stroke-width="2" marker-end="url(#a)" stroke-dasharray="6 4"/><text x="355" y="70" font-size="14" fill="#173247" text-anchor="start">completion / interrupt</text><text x="285" y="320" font-size="15" fill="#173247" text-anchor="start">DMA data path</text><text x="305" y="415" font-size="19" fill="#173247" text-anchor="start">Latency ≠ bandwidth ≠ capacity</text></g></svg>
