<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Rank / SVD: which directions survive?</title><desc id="desc">Original 2D SVD role diagram; diag(2,0) collapses the plane to a line. Rectangular cases require different shapes.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#166c85"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#173247" text-anchor="start">Rank / SVD: which directions survive?</text><rect x="30" y="80" width="200" height="75" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="44" y="108" font-size="18" fill="#173247" text-anchor="start">Input plane</text><text x="44" y="133" font-size="14" fill="#173247" text-anchor="start">vector coordinates</text><line x1="230" y1="116" x2="275" y2="116" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="280" y="80" width="170" height="75" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="294" y="108" font-size="18" fill="#173247" text-anchor="start">V transpose</text><text x="294" y="133" font-size="14" fill="#173247" text-anchor="start">orthogonal</text><line x1="450" y1="116" x2="495" y2="116" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="500" y="80" width="150" height="75" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="514" y="108" font-size="18" fill="#173247" text-anchor="start">Sigma</text><text x="514" y="133" font-size="14" fill="#173247" text-anchor="start">axis scaling</text><line x1="650" y1="116" x2="695" y2="116" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="80" width="170" height="75" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="714" y="108" font-size="18" fill="#173247" text-anchor="start">U</text><text x="714" y="133" font-size="14" fill="#173247" text-anchor="start">orthogonal</text><text x="30" y="205" font-size="20" fill="#173247" text-anchor="start">Tiny example: A = diag(2, 0), rank = 1</text><line x1="35" y1="320" x2="125" y2="320" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="80" y1="365" x2="80" y2="275" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="235" y1="320" x2="325" y2="320" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="280" y1="365" x2="280" y2="275" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><polygon points="45,285 115,285 115,355 45,355" fill="#dcebf4" stroke="#166c85"/><line x1="145" y1="320" x2="215" y2="320" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="210" y1="320" x2="350" y2="320" stroke="#bd5818" stroke-width="7"/><text x="30" y="410" font-size="16" fill="#173247" text-anchor="start">Nonzero singular values count surviving dimensions; orthogonal maps can include reflections.</text></g></svg>
