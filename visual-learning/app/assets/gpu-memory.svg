<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">SIMT groups and memory patterns</title><desc id="desc">Original scaled four-lane group comparing contiguous and strided addresses and diverging branch paths. Exact transactions depend on alignment, type and architecture.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#166c85"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#173247" text-anchor="start">SIMT groups and memory patterns</text><text x="35" y="87" font-size="18" fill="#173247" text-anchor="start">Four teaching lanes; NOT hardware warp size</text><text x="35" y="130" font-size="16" fill="#173247" text-anchor="start">Lane</text><text x="180" y="130" font-size="16" fill="#173247" text-anchor="start">0</text><text x="310" y="130" font-size="16" fill="#173247" text-anchor="start">1</text><text x="440" y="130" font-size="16" fill="#173247" text-anchor="start">2</text><text x="570" y="130" font-size="16" fill="#173247" text-anchor="start">3</text><text x="35" y="190" font-size="16" fill="#173247" text-anchor="start">Contiguous</text><rect x="145" y="160" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="159" y="188" font-size="18" fill="#173247" text-anchor="start">0</text><text x="159" y="213" font-size="14" fill="#173247" text-anchor="start"></text><rect x="275" y="160" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="289" y="188" font-size="18" fill="#173247" text-anchor="start">1</text><text x="289" y="213" font-size="14" fill="#173247" text-anchor="start"></text><rect x="405" y="160" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="419" y="188" font-size="18" fill="#173247" text-anchor="start">2</text><text x="419" y="213" font-size="14" fill="#173247" text-anchor="start"></text><rect x="535" y="160" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="549" y="188" font-size="18" fill="#173247" text-anchor="start">3</text><text x="549" y="213" font-size="14" fill="#173247" text-anchor="start"></text><text x="35" y="250" font-size="16" fill="#173247" text-anchor="start">Strided</text><rect x="145" y="220" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="159" y="248" font-size="18" fill="#173247" text-anchor="start">0</text><text x="159" y="273" font-size="14" fill="#173247" text-anchor="start"></text><rect x="275" y="220" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="289" y="248" font-size="18" fill="#173247" text-anchor="start">8</text><text x="289" y="273" font-size="14" fill="#173247" text-anchor="start"></text><rect x="405" y="220" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="419" y="248" font-size="18" fill="#173247" text-anchor="start">16</text><text x="419" y="273" font-size="14" fill="#173247" text-anchor="start"></text><rect x="535" y="220" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="549" y="248" font-size="18" fill="#173247" text-anchor="start">24</text><text x="549" y="273" font-size="14" fill="#173247" text-anchor="start"></text><text x="35" y="310" font-size="16" fill="#173247" text-anchor="start">Branch path</text><rect x="145" y="280" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="159" y="308" font-size="18" fill="#173247" text-anchor="start">A</text><text x="159" y="333" font-size="14" fill="#173247" text-anchor="start"></text><rect x="275" y="280" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="289" y="308" font-size="18" fill="#173247" text-anchor="start">A</text><text x="289" y="333" font-size="14" fill="#173247" text-anchor="start"></text><rect x="405" y="280" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="419" y="308" font-size="18" fill="#173247" text-anchor="start">B</text><text x="419" y="333" font-size="14" fill="#173247" text-anchor="start"></text><rect x="535" y="280" width="105" height="47" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="549" y="308" font-size="18" fill="#173247" text-anchor="start">B</text><text x="549" y="333" font-size="14" fill="#173247" text-anchor="start"></text><rect x="35" y="365" width="250" height="70" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="393" font-size="18" fill="#173247" text-anchor="start">GPU on-chip</text><text x="49" y="418" font-size="14" fill="#173247" text-anchor="start">shared memory / caches</text><rect x="345" y="365" width="240" height="70" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="359" y="393" font-size="18" fill="#173247" text-anchor="start">VRAM</text><text x="359" y="418" font-size="14" fill="#173247" text-anchor="start">off-chip device memory</text><rect x="645" y="365" width="220" height="70" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="659" y="393" font-size="18" fill="#173247" text-anchor="start">CPU / host</text><text x="659" y="418" font-size="14" fill="#173247" text-anchor="start">transfer / sync cost</text><line x1="285" y1="400" x2="343" y2="400" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><line x1="585" y1="400" x2="643" y2="400" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/></g></svg>
