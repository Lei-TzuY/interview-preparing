<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">Normalization follows a domain dependency</title><desc id="desc">Original enrollment example showing partial dependency Course determines Instructor and lossless decomposition under the stated assumption.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#166c85"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#173247" text-anchor="start">Normalization follows a domain dependency</text><rect x="35" y="90" width="400" height="85" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="118" font-size="18" fill="#173247" text-anchor="start">Enrollment(Student, Course, Instructor)</text><text x="49" y="143" font-size="14" fill="#173247" text-anchor="start">Assumption: Course → Instructor</text><text x="55" y="208" font-size="17" fill="#173247" text-anchor="start">(S1, C1, Prof A)</text><text x="55" y="243" font-size="17" fill="#173247" text-anchor="start">(S2, C1, Prof A)</text><text x="55" y="278" font-size="17" fill="#173247" text-anchor="start">(S3, C2, Prof B)</text><line x1="440" y1="215" x2="500" y2="215" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="520" y="90" width="345" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="534" y="118" font-size="18" fill="#173247" text-anchor="start">Enrollment(Student, Course)</text><text x="534" y="143" font-size="14" fill="#173247" text-anchor="start">(S1,C1), (S2,C1), (S3,C2)</text><rect x="520" y="240" width="345" height="100" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="534" y="268" font-size="18" fill="#173247" text-anchor="start">CourseInfo(Course, Instructor)</text><text x="534" y="293" font-size="14" fill="#173247" text-anchor="start">(C1,Prof A), (C2,Prof B)</text><line x1="695" y1="190" x2="695" y2="238" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><text x="705" y="222" font-size="14" fill="#173247" text-anchor="start">join Course</text><text x="35" y="395" font-size="17" fill="#173247" text-anchor="start">Key = (Student, Course); Instructor depends on only part of that key.</text><text x="35" y="430" font-size="16" fill="#173247" text-anchor="start">Fewer update anomalies; joins and consistency rules remain engineering decisions.</text></g></svg>
