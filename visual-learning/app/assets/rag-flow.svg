<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-labelledby="title desc"><title id="title">RAG and fine-tuning act at different boundaries</title><desc id="desc">RAG adds retrieved evidence into context; fine-tuning changes parameters or adapters. Generation claims still need evaluation and source entailment checks.</desc><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10z" fill="#166c85"/></marker></defs><rect width="900" height="460" fill="#fff"/><g font-family="system-ui,sans-serif"><text x="30" y="40" font-size="24" fill="#173247" text-anchor="start">RAG and fine-tuning act at different boundaries</text><rect x="35" y="95" width="165" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="49" y="123" font-size="18" fill="#173247" text-anchor="start">Question</text><text x="49" y="148" font-size="14" fill="#173247" text-anchor="start">task / query</text><line x1="200" y1="135" x2="240" y2="135" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="245" y="95" width="185" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="259" y="123" font-size="18" fill="#173247" text-anchor="start">Retriever</text><text x="259" y="148" font-size="14" fill="#173247" text-anchor="start">select documents</text><line x1="430" y1="135" x2="470" y2="135" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="475" y="95" width="180" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="489" y="123" font-size="18" fill="#173247" text-anchor="start">Prompt context</text><text x="489" y="148" font-size="14" fill="#173247" text-anchor="start">finite window</text><line x1="655" y1="135" x2="695" y2="135" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="700" y="95" width="165" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="714" y="123" font-size="18" fill="#173247" text-anchor="start">Generator</text><text x="714" y="148" font-size="14" fill="#173247" text-anchor="start">produce claims</text><rect x="245" y="275" width="225" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="259" y="303" font-size="18" fill="#173247" text-anchor="start">Fine-tuning</text><text x="259" y="328" font-size="14" fill="#173247" text-anchor="start">update weights / adapters</text><line x1="470" y1="315" x2="765" y2="190" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><rect x="575" y="275" width="290" height="80" rx="8" fill="#edf4fa" stroke="#8ca9bf"/><text x="589" y="303" font-size="18" fill="#173247" text-anchor="start">Evidence check</text><text x="589" y="328" font-size="14" fill="#173247" text-anchor="start">claim supported by source?</text><line x1="785" y1="175" x2="785" y2="273" stroke="#166c85" stroke-width="2" marker-end="url(#a)"/><text x="35" y="414" font-size="16" fill="#173247" text-anchor="start">Retrieval and tuning can combine; relevant context does not guarantee factual generation.</text></g></svg>
